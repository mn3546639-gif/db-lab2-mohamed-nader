{% extends 'base.html' %}{% block content %}<section class="card auth"><h1>Create an account</h1><p class="muted">Keep your tasks in one place.</p><form method="post" data-kind="register" novalidate><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}"><div class="errors" role="alert">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>
<label>Name<input name="name" maxlength="100" autocomplete="name" value="{{ request.form.get('name', '') }}"></label><label>Email<input name="email" maxlength="255" autocomplete="email" value="{{ request.form.get('email', '') }}"></label><label>Password<input type="password" name="password" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password"></label><button>Register</button></form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}

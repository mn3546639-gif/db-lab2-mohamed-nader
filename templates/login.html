{% extends 'base.html' %}{% block content %}<section class="card auth"><h1>Welcome back</h1><p class="muted">Log in to your personal to-do list.</p><form method="post" data-kind="login" novalidate><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}"><div class="errors" role="alert">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div><label>Email<input name="email" autocomplete="email" value="{{ request.form.get('email', '') }}"></label><label>Password<input type="password" name="password" autocomplete="current-password"></label><button>Log in</button></form><p>New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}

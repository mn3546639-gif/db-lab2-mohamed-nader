{% extends 'base.html' %}{% block content %}<section class="card"><h1>Your to-do list</h1><p class="muted">Add a task, update its title, or tick it off and save.</p><div class="errors" role="alert">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div><form class="add" method="post" action="{{ url_for('add_todo') }}" data-kind="todo" novalidate><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}"><div class="errors" role="alert"></div><label class="grow">What needs to be done?<input name="title" placeholder="e.g. Finish the database lab" value="{{ request.form.get('title', '') if request.endpoint == 'add_todo' else '' }}"></label><button>Add</button></form>
{% for item in items %}<article class="task {{ 'done' if item.is_done else '' }}"><form method="post" action="{{ url_for('save_todo', todo_id=item.todo_id) }}" data-kind="todo" novalidate><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}"><div class="errors" role="alert"></div><div class="task-fields"><label class="check"><input type="checkbox" name="is_done" value="1" {{ 'checked' if item.is_done else '' }}>Done</label><input class="grow" aria-label="Task title" name="title" value="{{ request.form.get('title', '') if request.endpoint == 'save_todo' and request.view_args.todo_id == item.todo_id else item.title }}"><button>Save</button></div></form><form method="post" action="{{ url_for('delete_todo', todo_id=item.todo_id) }}" data-delete><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}"><button class="danger">Delete</button></form></article>{% else %}<p class="empty">No tasks yet. Add your first to-do above!</p>{% endfor %}</section>{% endblock %}
